name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: FacElectronica

jobs:
  build-static:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install static Qt 6.8.3
        uses: AllanChain/install-qt-static@v6.8.3-1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build
        shell: cmd
        run: |
          mkdir build
          cd build
          qt-cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ..
          cmake --build . --config Release --parallel

      - name: Package single exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "${{ env.APP_NAME }}.exe" |
            Select-Object -First 1
          if (-not $exe) {
            throw "Build output not found"
          }
          $name = "${{ env.APP_NAME }}-${{ github.sha }}-win64-static.exe"
          if ("${{ github.ref_type }}" -eq "tag") {
            $name = "${{ env.APP_NAME }}-${{ github.ref_name }}-win64-static.exe"
          }
          Copy-Item $exe.FullName $name
          echo "ASSET_NAME=$name" >> $env:GITHUB_ENV
          Write-Host "Packed $($exe.FullName) -> $name ($([math]::Round($exe.Length/1MB, 1)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-win64-static
          path: ${{ env.ASSET_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
